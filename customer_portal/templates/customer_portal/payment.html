<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-4">Complete Payment</h1>
        
        <div class="mb-6 p-4 bg-gray-50 rounded border">
            <h2 class="font-semibold text-lg border-b pb-2 mb-2">Order Summary</h2>
            <p class="flex justify-between"><span>Product:</span> <span>{{ order.product.name }}</span></p>
            <p class="flex justify-between"><span>Quantity:</span> <span>{{ order.quantity }}</span></p>
            <p class="flex justify-between font-bold mt-2 pt-2 border-t text-lg"><span>Total:</span> <span>${{ total }}</span></p>
        </div>

        <form method="post" action="{% url 'process_payment' order.id %}">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Cardholder Name</label>
                <input type="text" placeholder="John Doe" class="w-full border p-2 rounded" required>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Card Number</label>
                <input type="text" placeholder="XXXX XXXX XXXX XXXX" class="w-full border p-2 rounded" required>
            </div>
            
            <div class="flex gap-4 mb-4">
                <div class="w-1/2">
                    <label class="block text-sm font-medium mb-1">Expiry Date</label>
                    <input type="text" placeholder="MM/YY" class="w-full border p-2 rounded" required>
                </div>
                <div class="w-1/2">
                    <label class="block text-sm font-medium mb-1">CVV</label>
                    <input type="text" placeholder="123" class="w-full border p-2 rounded" required>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-green-500 text-white px-4 py-3 rounded font-bold hover:bg-green-600">Pay ${{ total }}</button>
        </form>
    </div>
</body>
</html>
